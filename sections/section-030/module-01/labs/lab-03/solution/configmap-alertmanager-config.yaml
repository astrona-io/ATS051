apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: starfleet
data:
  alertmanager.yaml: "global:\n  resolve_timeout: 1m\nreceivers:\n- name: discard\n\
    - name: warning-webhook\n  webhook_configs:\n  - send_resolved: true\n    url:\
    \ http://probe:8080/hooks\nroute:\n  group_by:\n  - alertname\n  - lab\n  group_interval:\
    \ 2s\n  group_wait: 0s\n  receiver: discard\n  repeat_interval: 1m\n  routes:\n\
    \  - matchers:\n    - severity=\"warning\"\n    receiver: warning-webhook\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      containers:
      - name: alertmanager
        image: quay.io/prometheus/alertmanager:v0.32.1
        ports:
        - containerPort: 9093
        args:
        - --config.file=/config/alertmanager.yaml
        - --storage.path=/alertmanager
        volumeMounts:
        - name: config
          mountPath: /config
        - name: storage
          mountPath: /alertmanager
      volumes:
      - name: config
        configMap:
          name: alertmanager-config
      - name: storage
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: starfleet
spec:
  selector:
    app: alertmanager
  ports:
  - port: 9093
    targetPort: 9093
